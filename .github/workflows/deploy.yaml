name: Build and deploy to Container Apps
on:
  push:
    branches:
      - main
jobs:
  changes:
    name: Oppdag endringer
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      infra: ${{ steps.filter.outputs.infra }}
    steps:
      - name: Checkout kode
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Filtrer endrede filer
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            backend:
              - 'src/Homely.Api/**'
              - 'src/Homely.Core/**'
              - 'src/Homely.Infrastructure/**'
              - 'tests/**'
              - 'Homely.slnx'
            frontend:
              - 'frontend/**'
            infra:
              - '.github/workflows/**'

  backend-test:
    name: Backend test (xUnit)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kode
        uses: actions/checkout@v7
      - name: Sett opp .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'
      - name: Cache NuGet-pakker
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-
      - name: Gjenopprett avhengigheter
        run: dotnet restore Homely.slnx
      - name: Bygg backend
        run: dotnet build Homely.slnx --no-restore
      - name: Kjør tester
        run: dotnet test tests/Homely.Api.Tests/Homely.Api.Tests.csproj --no-build

  frontend-build:
    name: Frontend build/test
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kode
        uses: actions/checkout@v7
      - name: Sett opp Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Installer avhengigheter
        working-directory: frontend
        run: npm ci
      - name: Bygg frontend
        working-directory: frontend
        run: npm run build
      - name: Kjør frontend-tester
        working-directory: frontend
        run: npm run test --if-present

  docker-build-push:
    name: Bygg og push Docker-image
    needs: [changes, backend-test, frontend-build]
    if: |
      always() &&
      (needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true') &&
      (needs.backend-test.result == 'success' || needs.backend-test.result == 'skipped') &&
      (needs.frontend-build.result == 'success' || needs.frontend-build.result == 'skipped')
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.tag }}
    steps:
      - name: Checkout kode
        uses: actions/checkout@v7
      - name: Logg inn på Azure
        uses: azure/login@v3
        with:
          creds: ${{ secrets.SETUP }}
      - name: Logg inn på ACR
        run: az acr login --name acrhomelydev01
      - name: Bygg og push image
        id: image
        run: |
          IMAGE_TAG=acrhomelydev01.azurecr.io/homely:${{ github.sha }}
          docker build -t "$IMAGE_TAG" -f src/Homely.Api/Dockerfile .
          docker push "$IMAGE_TAG"
          echo "tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy til Container Apps
    needs: docker-build-push
    if: needs.docker-build-push.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Logg inn på Azure
        uses: azure/login@v3
        with:
          creds: ${{ secrets.SETUP }}
      - name: Oppdater Container App med nytt image
        run: az containerapp update --name homely-api --resource-group "rg-homely" --image ${{ needs.docker-build-push.outputs.image }}
