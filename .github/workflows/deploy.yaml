name: Build and deploy to Container Apps
on:
  push:
    branches:
      - main
jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      infra: ${{ steps.filter.outputs.infra }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Filter changed files
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            backend:
              - 'src/Homely.Api/**'
              - 'src/Homely.Core/**'
              - 'src/Homely.Infrastructure/**'
              - 'tests/**'
              - 'Homely.slnx'
            frontend:
              - 'frontend/**'
            infra:
              - '.github/workflows/**'

  backend-test:
    name: Backend test (xUnit)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'
      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-
      - name: Restore dependencies
        run: dotnet restore Homely.slnx
      - name: Build backend
        run: dotnet build Homely.slnx --no-restore
      - name: Run tests
        run: dotnet test tests/Homely.Api.Tests/Homely.Api.Tests.csproj --no-build

  frontend-build:
    name: Frontend build/test
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Run frontend tests
        working-directory: frontend
        run: npm run test --if-present

  backend-image:
    name: Build and push backend image
    needs: [changes, backend-test]
    if: needs.changes.outputs.backend == 'true' && needs.backend-test.result == 'success'
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Log in to Azure
        uses: azure/login@v3
        with:
          creds: ${{ secrets.SETUP }}
      - name: Log in to ACR
        run: az acr login --name acrhomelydev01
      - name: Build and push image
        id: image
        run: |
          IMAGE_TAG=acrhomelydev01.azurecr.io/homely-api:${{ github.sha }}
          docker build -t "$IMAGE_TAG" -f src/Homely.Api/Dockerfile .
          docker push "$IMAGE_TAG"
          echo "tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"

  frontend-image:
    name: Build and push frontend image
    needs: [changes, frontend-build]
    if: needs.changes.outputs.frontend == 'true' && needs.frontend-build.result == 'success'
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Log in to Azure
        uses: azure/login@v3
        with:
          creds: ${{ secrets.SETUP }}
      - name: Log in to ACR
        run: az acr login --name acrhomelydev01
      - name: Build and push image
        id: image
        run: |
          IMAGE_TAG=acrhomelydev01.azurecr.io/homely-frontend:${{ github.sha }}
          docker build \
            -t "$IMAGE_TAG" \
            -f frontend/Dockerfile \
            --build-arg VITE_API_BASE_URL=https://homely-api.bluestone-27664e24.norwayeast.azurecontainerapps.io \
            frontend
          docker push "$IMAGE_TAG"
          echo "tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"

  deploy-backend:
    name: Deploy backend to Container Apps
    needs: backend-image
    if: needs.backend-image.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Log in to Azure
        uses: azure/login@v3
        with:
          creds: ${{ secrets.SETUP }}
      - name: Update Container App with new image
        run: az containerapp update --name homely-api --resource-group "rg-homely" --image ${{ needs.backend-image.outputs.image }}

  deploy-frontend:
    name: Deploy frontend to Container Apps
    needs: frontend-image
    if: needs.frontend-image.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Log in to Azure
        uses: azure/login@v3
        with:
          creds: ${{ secrets.SETUP }}
      - name: Update Container App with new image
        run: az containerapp update --name homely-web --resource-group "rg-homely" --image ${{ needs.frontend-image.outputs.image }}
