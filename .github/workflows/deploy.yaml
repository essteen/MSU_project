name: Build and deploy to Container Apps

on:
  push:
    branches:
      - main
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Logg inn på Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.SETUP }}

      - name: Logg inn på ACR
        run: az acr login --name acrhomelydev01

      - name: Bygg og push image
        run:
          docker build -t acrhomelydev01.azurecr.io/homely:${{ github.sha }} .
          docker push acrhomelydev01.azurecr.io/homely:${{ github.sha }}

      - name: Oppdater Container App med nytt image
        run: az containerapp update --name household-env --resource-group "rg-homely" --image acrhomelydev01.azurecr.io/homely:${{ github.sha }}